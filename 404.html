<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Page Not Found · CraftNest</title>
  <link rel="icon" type="image/jpeg" href="images/hero 1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #7c5c3e;
      --accent-light: #a8836a;
      --accent-dark: #5a3f2a;
      --text-white: #ece5d8;
      --text-muted: #a89a8c;
      --bg-dark: #12100d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle warm radial glow in background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 30%, rgba(168, 131, 106, 0.06), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(124, 92, 62, 0.06), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== WRAPPER ===== */
    .error-wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
      width: 100%;
    }

    /* ===== 404 NUMBER WITH SOFT GLOW ===== */
    .error-number {
      font-size: 11rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: 'Inter', sans-serif;
    }
    .error-number .four {
      color: var(--accent-light);
      text-shadow:
        0 0 14px rgba(168, 131, 106, 0.55),
        0 0 40px rgba(168, 131, 106, 0.25);
    }
    .error-number .zero {
      color: #f3ede2;
      text-shadow:
        0 0 14px rgba(243, 237, 226, 0.45),
        0 0 40px rgba(243, 237, 226, 0.18);
      margin: 0 0.06em;
    }

    /* ===== TITLE ===== */
    .error-title {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #f3ede2;
      margin-bottom: 1.1rem;
    }
    .error-title span {
      color: var(--accent-light);
      text-shadow: 0 0 22px rgba(168, 131, 106, 0.4);
    }

    /* ===== MESSAGE ===== */
    .error-msg {
      font-size: 1.02rem;
      color: var(--text-muted);
      line-height: 1.75;
      max-width: 560px;
      margin: 0 auto 2.2rem;
    }

    /* ===== BUTTON ===== */
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 1rem 2.3rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.2px;
      transition: 0.3s ease;
      box-shadow:
        0 0 14px rgba(124, 92, 62, 0.35),
        0 6px 18px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .error-btn i {
      font-size: 0.95rem;
      transition: transform 0.3s ease;
    }
    .error-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-3px);
      box-shadow:
        0 0 24px rgba(168, 131, 106, 0.55),
        0 10px 26px rgba(0, 0, 0, 0.55);
    }
    .error-btn:hover i { transform: translateX(-4px); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 767px) {
      .error-wrap { padding: 2rem 1.2rem 3rem; }
      .error-number { font-size: 7.5rem; }
      .error-title { font-size: 1.85rem; }
      .error-msg { font-size: 0.93rem; margin-bottom: 1.8rem; }
      .error-btn { padding: 0.9rem 1.9rem; font-size: 0.92rem; gap: 10px; }
    }
    @media (max-width: 480px) {
      .error-number { font-size: 5.8rem; }
      .error-title { font-size: 1.5rem; }
      .error-msg { font-size: 0.86rem; line-height: 1.65; margin-bottom: 1.5rem; }
      .error-btn { padding: 0.8rem 1.6rem; font-size: 0.85rem; gap: 9px; }
      .error-btn i { font-size: 0.85rem; }
    }
    @media (max-width: 380px) {
      .error-number { font-size: 4.8rem; }
      .error-title { font-size: 1.3rem; }
      .error-msg { font-size: 0.8rem; }
      .error-btn { padding: 0.7rem 1.4rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="error-wrap">

    <!-- 404 NUMBER -->
    <div class="error-number">
      <span class="four">4</span>
      <span class="zero">0</span>
      <span class="four">4</span>
    </div>

    <!-- TITLE -->
    <h1 class="error-title">This Page Drifted <span>Into The Dust</span></h1>

    <!-- MESSAGE -->
    <p class="error-msg">
      Oops! The page you're looking for doesn't exist anymore — or may have been moved. Let's get you back to something worth holding onto.
    </p>

    <!-- CTA BUTTON -->
    <a href="index.html" class="error-btn">
      <i class="fas fa-arrow-left"></i> Back to CraftNest
    </a>

  </div>

</body>
</html>
